CPUMIN=392000
CPUMAX=996000
GOVERNOR=interactive
SERIALCON=ttyS0
ARCH=arm64

UBOOT_TARGET_MAP=";spi;u-boot.bin"

CONSOLE_AUTOLOGIN=no
ROOTPWD=root
FORCE_BOOTSCRIPT_UPDATE=yes
VENDOR=Armbian
NETWORKING_STACK=network-manager
INCLUDE_HOME_DIR=yes

# Skip unneeded wifi drivers
declare -g KERNEL_DRIVERS_SKIP+=(driver_generic_bring_back_ipx driver_mt7921u_add_pids driver_rtl8152_rtl8153 driver_rtl8189ES
    driver_rtl8189FS driver_rtl8192EU driver_rtl8811_rtl8812_rtl8814_rtl8821 driver_xradio_xr819 driver_rtl8811CU_rtl8821C
    driver_rtl8188EU_rtl8188ETV driver_rtl88x2bu driver_rtw88 driver_rtl88x2cs driver_rtl8822cs_bt driver_rtl8723DS
    driver_rtl8822BS driver_uwe5622 driver_rtl8723cs driver_rtl8852bs driver_rtl8723DU)

if [[ $TFABOOT == yes ]]; then
	UBOOT_TARGET_MAP=";sd;sdcard-loader.bin"
else
	if [[ $SECUREBOOT == yes ]]; then
		UBOOT_TARGET_MAP=";spi;u-boot-dtb.bin spl/u-boot-spl.bin u-boot-with-spl-pbl.bin"
	fi
fi


KERNELDIR='linux-qoriq'
KERNELSOURCE='https://github.com/nxp-qoriq/linux.git'
KERNELBRANCH="branch:lf-6.6.y"
KERNEL_MAJOR_MINOR="6.6"

#U-boot source from My branch with modified DTSI
BOOTSOURCE='https://github.com/ramazan-yestekbayev/u-boot.git'
BOOTSOURCEDIR='u-boot-qoriq'
BOOTBRANCH='branch:lf_v2025.04'

# BOOTBRANCH='tag:v2024.10'

ATFSOURCE='https://github.com/nxp-qoriq/atf.git'
ATFDIR='arm-trusted-firmware-qoriq'
ATFBRANCH='branch:lf_v2.10'
ATF_TARGET_MAP="bl31;;build/fvp/release/bl31.bin"

RCWDIR='rcw-qoriq'

OPTEESOURCE='https://github.com/nxp-qoriq/optee_os.git'
OPTEEBRANCH='branch:lf-6.18.2_1.0.0'
OPTEEDIR='optee_os-qoriq'

PFESOURCE='https://github.com/nxp-qoriq/qoriq-engine-pfe-bin.git'
PFEBRANCH='branch:lf-6.6.36-2.1.0'
PFEDIR='pfe-engine'

FMUCODESOURCE='https://github.com/NXP/qoriq-fm-ucode'
FMUCODEBRANCH='branch:LSDK-21.08'
FMUCODEDIR='fm-ucode'

write_uboot_platform() {
	if [[ $BOARD == "trustbox-401" || $BOARD == "trustbox-201"  ]]; then
		dd if=$1/sdcard-loader.bin of=$2 bs=512 seek=8 status=noxfer > /dev/null 2>&1
	fi
}

uboot_custom_postprocess() {
	(fetch_from_repo "$RCWSOURCE" "$RCWDIR" "$RCWBRANCH" "yes")
	(fetch_from_repo "$OPTEESOURCE" "$OPTEEDIR" "$OPTEEBRANCH" "yes")
	(fetch_from_repo "$FMUCODESOURCE" "$FMUCODEDIR" "$FMUCODEBRANCH" "yes")

	local atfdir="$SRC/cache/sources/$ATFDIR/${ATFBRANCH##*:}"
	local ubootdir="$SRC/cache/sources/$BOOTSOURCEDIR"
	local rcwdir="$SRC/cache/sources/$RCWDIR/${RCWBRANCH##*:}"
	local teedir="$SRC/cache/sources/$OPTEEDIR/${OPTEEBRANCH##*:}"
	local fmucodedir="$SRC/cache/sources/$FMUCODEDIR/${FMUCODEBRANCH##*:}"

	pushd $rcwdir > /dev/null
	display_alert "Building RCW" "" "info"
	advanced_patch "rcw" "rcw-qoriq" "$BOARD"
	make
	popd > /dev/null

	pushd "$teedir" > /dev/null
	display_alert "Building OP-TEE" "" "info"

	display_alert "Applying OP-TEE memory patch" "" "info"
	patch -p1 --forward < "$SRC/patch/optee/0001-plat-ls-Add-LS1028A-dynamic-SHM-memory-registration.patch" || true

	make clean || true

	STMM_FD="$SRC/userpatches/BL32_AP_MM.fd"
	[ -r "$STMM_FD" ] || { echo "Missing StandaloneMM image: $STMM_FD"; exit 1; }

	cp -f "$STMM_FD" ./BL32_AP_MM.fd

	CROSS_COMPILE32=arm-linux-gnueabihf- make -j"$(nproc)" \
		PLATFORM=${OPTEE_PLATFORM} \
		CFG_ARM64_core=y \
		CFG_STMM_PATH=BL32_AP_MM.fd \
		CFG_RPMB_FS=y \
		CFG_RPMB_FS_DEV_ID=1 \
		CFG_CORE_HEAP_SIZE=1048576 \
		CFG_RPMB_FS_CACHE_ENTRIES=512 \
		CFG_RPMB_FS_RD_ENTRIES=64 \
		CFG_RPMB_WRITE_KEY=n \
		CFG_CORE_DYN_SHM=y \
		CFG_RPMB_TESTKEY=y \
		CFG_REE_FS=n \
		CFG_TEE_CORE_LOG_LEVEL=1 \
		CFG_TEE_TA_LOG_LEVEL=1 \
		CFG_SCTLR_ALIGNMENT_CHECK=n \
		CFG_AUTO_MAX_PA_BITS=y \
		CFG_RPMB_RESET_FAT=n \
		CFG_WITH_SOFTWARE_PRNG=n \
		CFG_CORE_BGET_BESTFIT=y \
		CFG_DRAM1_BASE=0x2080000000 \
		CFG_DRAM1_SIZE=0x80000000

	popd > /dev/null

	pushd $atfdir > /dev/null
	make distclean
	display_alert "Building TF-A" "" "info"

	make CROSS_COMPILE="$CCACHE $toolchain/$ATF_COMPILER" PLAT=${ATF_PLATFORM} \
		all fip pbl BOOT_MODE=${ATF_BOOT_MODE} RCW="$rcwdir/${RCWPATH[${ATF_BOOT_MODE}$secext]}" SPD=opteed \
		BL32="$teedir/out/arm-plat-ls/core/tee-raw.bin" \
		BL33="$ubootdir/u-boot.bin" $secureopt $fuseopt

	if [[ ${ATF_BOOT_MODE} == sd ]]; then
		dd if=build/${ATF_PLATFORM}/release/bl2_sd$secext.pbl of="sdcard-loader.bin" bs=512
		dd if=build/${ATF_PLATFORM}/release/fip.bin of="sdcard-loader.bin" bs=512 seek=2040
		if [[ -n "${FMAN_UCODE}" ]]; then
			dd if=$fmucodedir/$FMAN_UCODE of="sdcard-loader.bin" bs=512 seek=18424
		fi
		cp sdcard-loader.bin $ubootdir/
	fi

	popd > /dev/null

	if [ $BOARD == "trustbox-101" ]; then
		(fetch_from_repo "$PFESOURCE" "$PFEDIR" "$PFEBRANCH" "yes")
	fi

	display_alert "Custom postprocess complete" "" "info"
}

family_tweaks() {

	chroot "${SDCARD}" /bin/bash -c 'adduser --quiet --disabled-password --home /home/admin --gecos admin admin'
	chroot "${SDCARD}" /bin/bash -c '(echo trust;echo trust) | passwd admin >/dev/null 2>&1'

	for additionalgroup in sudo netdev audio video disk tty users games dialout plugdev input systemd-journal; do
		display_alert "Adding ${additionalgroup} group" "" "info"
		chroot "${SDCARD}" /bin/bash -c "usermod -aG ${additionalgroup} admin" 2>/dev/null
	done

	rm -f "${SDCARD}/root/.not_logged_in_yet"
	chroot "${SDCARD}" usermod -L root

	if [ $BOARD == "trustbox-101" ]; then
		# copy ATF artifacts
		cp $SRC/cache/sources/$ATFDIR/${ATFBRANCH##*:}/build/${ATF_PLATFORM}/release/{bl2_${ATF_BOOT_MODE}$secext.pbl,fip.bin} ${SDCARD}/
		# copy PFE firmware
		cp $SRC/cache/sources/$PFEDIR/${PFEBRANCH##*:}/ls1012a/u-boot/pfe_fw_sbl.itb ${SDCARD}/
	fi

	wget https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O ${SDCARD}/packages-microsoft-prod.deb
	chroot "${SDCARD}" /bin/bash -c 'dpkg -i /packages-microsoft-prod.deb && rm -f /packages-microsoft-prod.deb'

	chroot "${SDCARD}" /bin/bash -c "apt-get update"

	# need to install seperately: iotedge preinst checks moby-engine exist
	chroot "${SDCARD}" /bin/bash -c "apt-get install -y moby-cli"
	chroot "${SDCARD}" /bin/bash -c "apt-get install -y moby-engine"
	chroot "${SDCARD}" /bin/bash -c "apt-get install -y aziot-edge"
}

function post_family_config__install_iptables {
	display_alert "Add the package iptables to the image" "" "info"
	add_packages_to_image "iptables" # iptables is needed for docker/moby-engine
}
